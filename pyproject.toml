[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfcash-engine"
version = "0.1.0"
description = "ShelfCash forecast engine and auditable multi-format preprocessing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8",
  "typer>=0.12",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",
  "openai>=1.99",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
demo = ["pyarrow>=17"]
forecast = ["lightgbm>=4.5", "scikit-learn>=1.5", "scipy>=1.13", "statsmodels>=0.14"]
parquet = ["pyarrow>=17"]
pdf = ["pdfplumber>=0.11"]
xls = ["xlrd>=2.0"]
ocr = ["Pillow>=10", "pytesseract>=0.3.13"]
test = ["pytest>=8.3", "reportlab>=4.2"]
all = [
  "lightgbm>=4.5", "scikit-learn>=1.5", "scipy>=1.13", "statsmodels>=0.14",
  "pyarrow>=17", "pdfplumber>=0.11", "xlrd>=2.0",
  "Pillow>=10", "pytesseract>=0.3.13", "pytest>=8.3", "reportlab>=4.2",
]

[project.scripts]
shelfcash-preprocess = "shelfcash_preprocess.cli:app"
shelfcash-forecast = "shelfcash_forecast.cli:app"
shelfcash-pipeline = "shelfcash_pipeline.run:main"
shelfcash-run = "shelfcash_pipeline.config_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shelfcash_forecast*", "shelfcash_preprocess*", "shelfcash_pipeline*"]
